server {
  listen       18898;
  server_name  _;
  charset utf-8;	 
  location / {
    alias /mnt/data/resouce/share/;
    fancyindex on;
    fancyindex_localtime on;
    fancyindex_time_format "%Y-%m-%d %H:%M";    
    fancyindex_hide_symlinks on;
    fancyindex_exact_size off;
    fancyindex_show_path off;
    fancyindex_header "/html/fancyindex_header.html";
    fancyindex_footer "/html/fancyindex_footer.html";
    
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
  }

  location /html {
    alias  /mnt/data/resouce/share/wdfs/;
    autoindex on;
    expires 10m;
    add_header Cache-Control "public";
  }

  location /wdfs/wdfs {
    alias  /mnt/data/resouce/share/wdfs/wdfs;
    autoindex on;
    expires 10m;
    add_header Cache-Control "public";
  }

  # 精确定位上传接口（WebDAV）
  location /upresourceshare {
    alias /mnt/data/resouce/share/;
        
    # 开启 WebDAV 支持
    dav_methods PUT DELETE MKCOL COPY MOVE;
    dav_access user:rw group:rw all:r;
    create_full_put_path on;
        
    # 允许大文件上传（按需调整）
    client_max_body_size 2G;

    # 【强烈建议】加上账号密码认证，否则任何人都能上传
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
 }

}
